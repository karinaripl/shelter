<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приют для животных - Вход</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-icon">🐾</div>
            <h1 class="title">Приют для животных</h1>
            <p class="subtitle">Введите логин и пароль для входа</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Логин</label>
                    <input type="text" id="login" name="login" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-login">Войти</button>
                <div id="error-message" class="error-message hidden"></div>
            </form>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
